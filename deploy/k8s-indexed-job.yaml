apiVersion: batch/v1
kind: Job
metadata:
  name: perimeterflow-sweep-30seeds
  namespace: perimeterflow
spec:
  completions: 30
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: perimeterflow-worker
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: sumo-evaluator
          image: ghcr.io/seyed-milad-jalilian/perimeterflow:latest
          command: ["python", "-m", "perimeterflow.cli"]
          args:
            - "worker"
            - "--seed-offset=11"
            - "--config=configs/evaluate_seeds.yaml"
            - "--params=results/calibrated_params.json"
          env:
            - name: JOB_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "400m"
              memory: "1Gi"
            limits:
              cpu: "500m"
              memory: "2Gi"
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            - name: results-volume
              mountPath: /out
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
        - name: results-volume
          persistentVolumeClaim:
            claimName: perimeterflow-results-pvc
