# PerimeterFlow — virtual uv project.
#
# This is deliberately a VIRTUAL project ([tool.uv] package = false): uv manages
# and locks dependencies, but the package itself is never built or installed.
# Tests import the package directly from src/ via [tool.pytest.ini_options].
#
# By project rule, NO version field is assigned anywhere in this file.

[project]
name = "perimeterflow"
# PEP 621 demands `version` or an explicit dynamic declaration; per project
# rules no version number is assigned anywhere, so version is declared
# dynamic and never given a value (the project is virtual and never built).
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jsonschema",
    "hypothesis",
    "ruff",
]
# Optional closed-loop simulation stack (SUMO + TraCI). These are NEVER
# required for tests or the pure-Python replay pipeline; install explicitly
# with `uv sync --extra sumo` on machines where the eclipse-sumo wheel is
# wanted. `network_gen` and `traci_runner` import traci/sumolib lazily inside
# functions and degrade gracefully when SUMO is absent.
sumo = [
    "eclipse-sumo",
    "traci",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
