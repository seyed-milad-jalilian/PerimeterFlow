[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perimeterflow"
version = "0.0.0"
description = "Bias-Aware MFD-Based Macroscopic Traffic State Estimation and Latency-Compensated Perimeter Control"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Seyed Milad Jalilian", email = "contact@miladjalilian.me" }
]
dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "pyyaml>=6.0.1",
  "jsonschema>=4.21.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "hypothesis>=6.98.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
