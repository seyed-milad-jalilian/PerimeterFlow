name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Schema, provenance, gate, estimator and controller tests
        run: uv run pytest tests/ -v
      - name: Validate planned artifact against schema
        run: |
          uv run python -m perimeterflow.cli init-planned \
            --config configs/evaluate_seeds.yaml --output results/ensemble.json
          uv run python - <<'EOF'
          import json
          from jsonschema import Draft202012Validator
          schema = json.load(open("data/schemas/mfd_artifact.schema.json"))
          artifact = json.load(open("results/ensemble.json"))
          Draft202012Validator(schema).validate(artifact)
          assert artifact["meta"]["status"] == "planned"
          rows = artifact["summary_table"] + artifact["ablation_comparisons"]
          for row in rows:
              for key, value in row.items():
                  if key.endswith(("pct", "veh_h", "diff", "low", "high", "delta", "p_value_raw", "p_value_holm")):
                      assert value is None, f"planned artifact must not carry {key}"
          print("planned artifact honest: all result fields null")
          EOF

  golden-parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate golden parity vectors from Python reference
        run: |
          uv sync --extra dev
          uv run python -m perimeterflow.cli export-golden ../data/golden/parity_vectors.json
      - name: Vitest golden parity (1e-9 Python <-> TypeScript)
        run: |
          npm ci
          npx vitest run

  report-compile:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Generate LaTeX macros from the planned artifact
        run: |
          uv sync --extra dev
          uv run python -m perimeterflow.cli init-planned \
            --config configs/evaluate_seeds.yaml --output results/ensemble.json
          uv run python report/render_tex_macros.py results/ensemble.json report/generated_metrics.tex
      - name: Compile IEEE report
        uses: dante-ev/latex-action@v2
        with:
          working_directory: report
          root_file: main.tex
          args: -interaction=nonstopmode -halt-on-error
