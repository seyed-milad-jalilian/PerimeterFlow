name: PerimeterFlow Verification & Golden Parity CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv and Python dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Install Node dependencies (Vitest)
        run: npm install

      - name: Initialize planned artifact & validate JSON Schema
        run: |
          python -c "from pathlib import Path; from perimeterflow.stats_eval import write_planned_skeleton_artifact; write_planned_skeleton_artifact(Path('results/ensemble.json'), Path('configs/evaluate_seeds.yaml'))"
          pytest tests/ -v

      - name: Verify 1e-9 Python-to-TypeScript Golden Parity
        run: |
          python -m perimeterflow.cli --export-golden data/golden/parity_vectors.json
          npx vitest run web_worker/parity.test.ts

      - name: Verify Zero-Manual-Number LaTeX Macro Generation
        run: |
          python report/render_tex_macros.py
          test -f report/generated_metrics.tex
